name: Update Landing Page Version

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag or version (defaults to latest GitHub release)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: update-landing-page
  cancel-in-progress: false

jobs:
  update-landing-page:
    name: Sync Landing Page to Release Tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Determine release version
        id: ver
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG=""
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Update docs/index.html, docs/install.sh, and README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ steps.ver.outputs.tag }}" ]; then
            python3 scripts/update-landing-page.py --repo "${GITHUB_REPOSITORY}" --version "${{ steps.ver.outputs.tag }}"
          else
            python3 scripts/update-landing-page.py --repo "${GITHUB_REPOSITORY}"
          fi

      - name: Commit and push updated landing page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/install.sh README.md
          if git diff --staged --quiet; then
            echo "Landing page is already up to date."
          else
            VER="${{ steps.ver.outputs.tag }}"
            git commit -m "docs: sync landing page to ${VER:-latest release}"
            git push origin main
          fi
