id: io.github.Antux912012.Imladris
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: imladris
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - '*.la'
  - '*.a'
modules:
  - name: imladris
    buildsystem: meson
    config-opts:
      - --buildtype=release
    sources:
      - type: git
        url: https://github.com/Antux912012/imladris.git
        tag: v0.25.0
