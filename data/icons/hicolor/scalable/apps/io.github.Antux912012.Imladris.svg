<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E222A"/>
      <stop offset="50%" stop-color="#2E3440"/>
      <stop offset="100%" stop-color="#1B2838"/>
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#88C0D0" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#EBCB8B" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#5E81AC" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="arch-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EBCB8B"/>
      <stop offset="100%" stop-color="#D08770"/>
    </linearGradient>
    <linearGradient id="frost-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8FBCBB"/>
      <stop offset="50%" stop-color="#88C0D0"/>
      <stop offset="100%" stop-color="#5E81AC"/>
    </linearGradient>
    <linearGradient id="page-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B4252"/>
      <stop offset="100%" stop-color="#252A34"/>
    </linearGradient>
  </defs>

  <!-- Outer GNOME HIG Squircle Shadow Base -->
  <rect x="32" y="38" width="448" height="444" rx="96" ry="96" fill="#0F1319" opacity="0.65"/>

  <!-- Main Squircle Background -->
  <rect x="32" y="28" width="448" height="448" rx="96" ry="96" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="6"/>

  <!-- Inner Subtle Filigree Ring -->
  <rect x="48" y="44" width="416" height="416" rx="82" ry="82" fill="none" stroke="#88C0D0" stroke-opacity="0.18" stroke-width="2"/>

  <!-- Scientific Notebook / 4-Quadrant Workbench Card -->
  <rect x="88" y="108" width="336" height="296" rx="28" ry="28" fill="url(#page-grad)" stroke="#4C566A" stroke-width="3"/>

  <!-- 4-Quadrant Divider Lines -->
  <line x1="256" y1="108" x2="256" y2="404" stroke="#434C5E" stroke-width="2.5"/>
  <line x1="88" y1="256" x2="424" y2="256" stroke="#434C5E" stroke-width="2.5"/>

  <!-- Quadrant 1 (Top-Left): Code & Quarto Syntax Bars -->
  <rect x="114" y="136" width="56" height="10" rx="5" fill="#88C0D0"/>
  <rect x="114" y="158" width="98" height="10" rx="5" fill="#A3BE8C"/>
  <rect x="130" y="180" width="82" height="10" rx="5" fill="#EBCB8B"/>
  <rect x="130" y="202" width="64" height="10" rx="5" fill="#D8DEE9" opacity="0.75"/>
  <rect x="114" y="224" width="44" height="10" rx="5" fill="#88C0D0"/>

  <!-- Quadrant 3 (Top-Right): Scientific Curve / Gaussian Distribution -->
  <path d="M 278 228 C 298 228, 310 144, 338 144 C 366 144, 378 228, 398 228" fill="none" stroke="url(#frost-grad)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="338" cy="144" r="6" fill="#EBCB8B"/>
  <circle cx="308" cy="186" r="4.5" fill="#88C0D0"/>
  <circle cx="368" cy="186" r="4.5" fill="#88C0D0"/>

  <!-- Quadrant 2 (Bottom-Left): Interactive REPL Prompt (> _) -->
  <path d="M 118 294 L 144 314 L 118 334" fill="none" stroke="#88C0D0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="158" y="326" width="42" height="8" rx="4" fill="#A3BE8C"/>
  <rect x="118" y="356" width="104" height="8" rx="4" fill="#D8DEE9" opacity="0.5"/>

  <!-- Quadrant 4 (Bottom-Right): Biostatistics Bar & Scatter Plot -->
  <rect x="284" y="336" width="18" height="42" rx="4" fill="#5E81AC"/>
  <rect x="314" y="308" width="18" height="70" rx="4" fill="#88C0D0"/>
  <rect x="344" y="284" width="18" height="94" rx="4" fill="#A3BE8C"/>
  <rect x="374" y="318" width="18" height="60" rx="4" fill="#EBCB8B"/>

  <!-- Central Rivendell / Elven Sanctuary Arch & Star of Eärendil Medallion -->
  <circle cx="256" cy="256" r="54" fill="#1E222A" stroke="url(#arch-grad)" stroke-width="4.5"/>
  <path d="M 220 282 C 220 236, 256 210, 256 210 C 256 210, 292 236, 292 282" fill="none" stroke="url(#arch-grad)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- 8-Pointed Star of Eärendil (Center) -->
  <polygon points="256,208 264,242 296,232 270,256 296,280 264,270 256,304 248,270 216,280 242,256 216,232 248,242" fill="#ECEFF4"/>
  <polygon points="256,220 261,248 289,256 261,264 256,292 251,264 223,256 251,248" fill="#88C0D0"/>
  <circle cx="256" cy="256" r="6" fill="#EBCB8B"/>
</svg>
