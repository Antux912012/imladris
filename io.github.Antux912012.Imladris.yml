id: io.github.Antux912012.Imladris
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: imladris
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home
  - --env=WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1
  - --env=WEBKIT_DISABLE_DMABUF_RENDERER=1
  - --talk-name=org.freedesktop.Flatpak
  - --talk-name=org.freedesktop.secrets
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - '*.la'
  - '*.a'
modules:
  - name: imladris
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/Antux912012/imladris.git
        tag: v0.25.0
