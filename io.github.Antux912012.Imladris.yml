id: io.github.Antux912012.Imladris
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: imladris
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home
  - --talk-name=org.freedesktop.Flatpak
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - '*.la'
  - '*.a'
modules:
  - name: imladris
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/Antux912012/imladris-next-md-editor.git
        tag: v0.15.1
        commit: 99fa26a1e1c7872e7894cd2432759a59265bbcae
