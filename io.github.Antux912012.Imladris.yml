id: io.github.Antux912012.Imladris
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: imladris
add-extensions:
  io.github.Antux912012.Imladris.Toolchain:
    directory: toolchain
    version: '50'
    add-ld-path: lib
    autodelete: true
    no-autodownload: true
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --talk-name=org.freedesktop.Flatpak
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  - --filesystem=xdg-cache/imladris:create
  - --filesystem=home
  - --env=PATH=/app/bin:/app/toolchain/bin:/usr/bin
  - --env=WEBKIT_DISABLE_DMABUF_RENDERER=1
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - '*.la'
  - '*.a'
modules:
  - name: imladris
    buildsystem: meson
    config-opts:
      - --buildtype=release
    post-install:
      - mkdir -p /app/toolchain
    sources:
      - type: dir
        path: .
