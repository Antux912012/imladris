id: io.github.Antux912012.Imladris
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: imladris
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --talk-name=org.freedesktop.Flatpak
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  - --filesystem=xdg-cache/imladris:create
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/imladris/cargo
    CARGO_NET_OFFLINE: 'true'
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - '*.la'
  - '*.a'
modules:
  - name: imladris
    buildsystem: meson
    config-opts:
      - --buildtype=release
    sources:
      - type: git
        url: https://github.com/Antux912012/imladris.git
        tag: v0.26.0
        commit: 32b9eddd14686dd6edeedf7565f8ee94457c1b6d
