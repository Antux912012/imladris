[package]
name = "imladris_core"
version = "0.27.0"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "imladris_core"
crate-type = ["staticlib"]

[dependencies]
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
